apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parrent-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/ssvitto/k8s-argo.git
    targetRevision: HEAD
    path: dev-env/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true